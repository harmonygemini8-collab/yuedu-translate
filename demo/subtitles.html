<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subtitle demo · Yuedu Translate</title>
  <!--
    A player of our own for recording the subtitle feature (doc/21 §4). Our own clip, our own
    subtitle file: nothing here belongs to anyone else, so the recording can be published.

    It also exercises the text-track path, the one a page cannot fake: the browser parses the VTT,
    the whole file is translated up front, and the player's own captions are never drawn.

      node scripts/serve.mjs . 4173     # from the repository root, so the video is served too
      http://127.0.0.1:4173/demo/subtitles.html

    Turn the extension on for 127.0.0.1, press play, then translate (Alt+Y).
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 18px;
      background: #0b1220;
      color: #e5e7eb;
      font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    }
    main { width: min(900px, 92vw); padding: 32px 0; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p.note { margin: 0 0 20px; color: #94a3b8; font-size: 14px; }
    video { width: 100%; border-radius: 10px; background: #000; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Yuedu Translate — subtitle demo</h1>
    <p class="note">Our own 45-second clip with its English subtitle file. Press play, then translate the page.</p>
    <video controls preload="metadata" poster="/release/assets/youtube-global-0.3.2/thumbnail-a-1280x720.jpg">
      <source src="/release/assets/video-global-0.3.2/yuedu-global-2k-master.mp4" type="video/mp4">
      <track default kind="subtitles" srclang="en" label="English" src="/demo/subtitles-en.vtt">
    </video>
  </main>
</body>
</html>
